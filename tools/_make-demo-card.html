<!DOCTYPE html>
<meta charset="utf-8" />
<title>demo card generator</title>
<!-- Dev-only: draws a feature-rich placeholder card and POSTs it to the
     dev server as assets/targets/card-source.png. Open via tools/dev-server.js. -->
<canvas id="c" width="1200" height="750" style="max-width:100%"></canvas>
<pre id="status">drawing…</pre>
<script>
  // Seeded PRNG so the artwork is reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(20260723);
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;

  // warm paper background
  ctx.fillStyle = "#f4efe6";
  ctx.fillRect(0, 0, W, H);

  const palette = ["#1b1b1f", "#ff5533", "#2456a8", "#1d8a63", "#e8b425"];

  // scattered asymmetric shapes — dense, non-repetitive texture
  for (let i = 0; i < 90; i++) {
    const x = rnd() * W, y = rnd() * H, s = 12 + rnd() * 70;
    ctx.fillStyle = palette[Math.floor(rnd() * palette.length)];
    ctx.globalAlpha = 0.55 + rnd() * 0.45;
    const kind = Math.floor(rnd() * 4);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rnd() * Math.PI * 2);
    if (kind === 0) {
      ctx.beginPath(); ctx.arc(0, 0, s / 2, 0, Math.PI * 2); ctx.fill();
    } else if (kind === 1) {
      ctx.fillRect(-s / 2, -s / 4, s, s / 2);
    } else if (kind === 2) {
      ctx.beginPath();
      ctx.moveTo(0, -s / 2); ctx.lineTo(s / 2, s / 2); ctx.lineTo(-s / 2, s / 3);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.strokeStyle = ctx.fillStyle;
      ctx.lineWidth = 3 + rnd() * 6;
      ctx.beginPath();
      ctx.moveTo(-s / 2, 0);
      ctx.quadraticCurveTo(0, -s, s / 2, 0);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // brand block (asymmetric, top-left)
  ctx.fillStyle = "#1b1b1f";
  ctx.fillRect(60, 60, 560, 150);
  ctx.fillStyle = "#f4efe6";
  ctx.font = "700 72px Arial";
  ctx.fillText("DEMO BRAND", 90, 158);
  ctx.fillStyle = "#ff5533";
  ctx.font = "600 34px Arial";
  ctx.fillText("AR EXPERIENCE — POINT & DISCOVER", 62, 260);

  // fake QR placeholder (bottom-right) — replace with a real QR to the
  // deployed URL when reskinning
  const qx = W - 260, qy = H - 260, qs = 200, m = 10, cell = qs / 21;
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(qx - m, qy - m, qs + 2 * m, qs + 2 * m);
  ctx.fillStyle = "#1b1b1f";
  for (let r = 0; r < 21; r++)
    for (let c = 0; c < 21; c++)
      if (rnd() > 0.5) ctx.fillRect(qx + c * cell, qy + r * cell, cell - 1, cell - 1);
  // QR finder squares
  for (const [fx, fy] of [[0, 0], [14, 0], [0, 14]]) {
    ctx.fillStyle = "#1b1b1f";
    ctx.fillRect(qx + fx * cell, qy + fy * cell, cell * 7, cell * 7);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(qx + (fx + 1) * cell, qy + (fy + 1) * cell, cell * 5, cell * 5);
    ctx.fillStyle = "#1b1b1f";
    ctx.fillRect(qx + (fx + 2) * cell, qy + (fy + 2) * cell, cell * 3, cell * 3);
  }
  ctx.fillStyle = "#1b1b1f";
  ctx.font = "600 22px Arial";
  ctx.fillText("SCAN TO START", qx + 18, qy + qs + 40);

  // border
  ctx.strokeStyle = "#1b1b1f";
  ctx.lineWidth = 8;
  ctx.strokeRect(10, 10, W - 20, H - 20);

  cv.toBlob(async (blob) => {
    const res = await fetch("/save?name=assets/targets/card-source.png", {
      method: "POST",
      body: blob,
    });
    document.getElementById("status").textContent =
      res.ok ? "SAVED assets/targets/card-source.png" : "SAVE FAILED";
  }, "image/png");
</script>
